<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <radialGradient id="radialCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialAmber" cx="50%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .anim-pulse {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .anim-float1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .anim-float2 {
        animation: floatSlow2 8s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 12, 16;
        animation: flowData 14s linear infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .text-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Glows (Strictly in Background) -->
  <g class="anim-pulse">
    <circle cx="180" cy="90" r="220" fill="url(#radialCyan)" />
    <circle cx="1020" cy="270" r="240" fill="url(#radialPurple)" />
    <circle cx="600" cy="40" r="200" fill="url(#radialAmber)" />
  </g>

  <!-- Subtle Modern Tech Grid -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Data Stream Accent Lines (Subtle peripheral decorative flow) -->
  <path d="M 40 320 Q 250 330 400 290 T 800 320 T 1160 300" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" class="flow-line" />
  <path d="M 40 40 Q 300 20 600 60 T 1160 40" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="2" class="flow-line" />

  <!-- Peripheral Animated Badges / Format Pills (Positioned safely on sides to NEVER obstruct center text) -->
  <!-- Left Side Badges -->
  <g class="anim-float1">
    <g transform="translate(48, 80)">
      <rect width="112" height="42" rx="10" fill="url(#pillBg)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="40" y="26" fill="#e2e8f0" font-size="13" class="text-badge">PDF / A</text>
    </g>
    <g transform="translate(36, 175)">
      <rect width="124" height="42" rx="10" fill="url(#pillBg)" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="24" cy="21" r="5" fill="#818cf8" />
      <text x="38" y="26" fill="#e2e8f0" font-size="13" class="text-badge">DOCX / ODT</text>
    </g>
    <g transform="translate(56, 265)">
      <rect width="105" height="38" rx="9" fill="url(#pillBg)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
      <text x="52" y="24" fill="#94a3b8" font-size="12" text-anchor="middle" class="text-badge">HTML2PDF</text>
    </g>
  </g>

  <!-- Right Side Badges -->
  <g class="anim-float2">
    <g transform="translate(1040, 80)">
      <rect width="112" height="42" rx="10" fill="url(#pillBg)" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="24" cy="21" r="5" fill="#c084fc" />
      <text x="40" y="26" fill="#e2e8f0" font-size="13" class="text-badge">REST API</text>
    </g>
    <g transform="translate(1030, 175)">
      <rect width="124" height="42" rx="10" fill="url(#pillBg)" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softShadow)" />
      <circle cx="24" cy="21" r="5" fill="#ec4899" />
      <text x="38" y="26" fill="#e2e8f0" font-size="13" class="text-badge">WASM / FOSS</text>
    </g>
    <g transform="translate(1045, 265)">
      <rect width="105" height="38" rx="9" fill="url(#pillBg)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
      <text x="52" y="24" fill="#94a3b8" font-size="12" text-anchor="middle" class="text-badge">MARKDOWN</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: High Z-index, perfectly legible, centered, guaranteed never obstructed -->
  <g id="foreground-content" transform="translate(600, 0)">
    <!-- Top Micro Badge -->
    <g transform="translate(-160, 48)">
      <rect width="320" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="20" cy="15" r="4" fill="#10b981" />
      <text x="170" y="20" fill="#38bdf8" font-size="11" text-anchor="middle" class="text-badge">⚡ CURATED REPOSITORY &amp; DIRECTORY ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" text-anchor="middle" fill="url(#titleGradient)" font-size="38" class="text-title" filter="url(#softShadow)">
      Awesome Document Generation &amp; Conversion API
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" text-anchor="middle" fill="#cbd5e1" font-size="16.5" class="text-subtitle">
      Enterprise SaaS APIs, High-Throughput Engines &amp; Sovereign Open-Source Stacks
    </text>

    <!-- Feature Highlights Row -->
    <g transform="translate(-360, 235)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="38" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="82" y="24" fill="#38bdf8" font-size="12.5" font-weight="600" text-anchor="middle" class="text-subtitle">📄 PDF Generation</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(180, 0)">
        <rect width="175" height="38" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="87" y="24" fill="#818cf8" font-size="12.5" font-weight="600" text-anchor="middle" class="text-subtitle">🔄 Format Conversion</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(370, 0)">
        <rect width="175" height="38" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="87" y="24" fill="#c084fc" font-size="12.5" font-weight="600" text-anchor="middle" class="text-subtitle">🌐 Headless Engines</text>
      </g>
      <!-- Feature 4 -->
      <g transform="translate(560, 0)">
        <rect width="160" height="38" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="80" y="24" fill="#34d399" font-size="12.5" font-weight="600" text-anchor="middle" class="text-subtitle">🤖 AI Extraction</text>
      </g>
    </g>

    <!-- Bottom Footer Meta text -->
    <text x="0" y="318" text-anchor="middle" fill="#64748b" font-size="12" class="text-subtitle">
      Automate DOCX • PDF • HTML • Markdown • Invoices • Receipts • Reports at Scale
    </text>
  </g>

  <!-- Outer Ambient Border Glow -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1.5" />
</svg>